name: Deploy production

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@11.22.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run Socket.IO integration test
        run: |
          PORT=3001 pnpm start >/tmp/scrumpoker-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3001/api/health
          SERVER_URL=http://127.0.0.1:3001 timeout 45s pnpm test:e2e

      - name: Build frontend (Socket.IO mode)
        env:
          BASE_PATH: /
          VITE_P2P: 'false'
        run: pnpm run build

      - name: Package static frontend and Node backend
        run: |
          mkdir -p release/public release/backend
          cp -a dist/. release/public/
          cp -a server src package.json pnpm-lock.yaml pnpm-workspace.yaml .npmrc release/backend/
          tar -czf release.tgz -C release .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrumpoker-release
          path: release.tgz
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: scrumpoker-release

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          python <<'PY' > ~/.ssh/deploy_key
          import os

          key = os.environ["VPS_SSH_KEY"]
          key = key.lstrip("\ufeff").strip()
          if len(key) >= 2 and key[0] == key[-1] and key[0] in "'\"":
              key = key[1:-1]
          key = key.replace("\\r\\n", "\n").replace("\\n", "\n")
          key = key.replace("\r\n", "\n").replace("\r", "\n")
          if not key.endswith("\n"):
              key += "\n"
          print(key, end="")
          PY
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          fi
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          scp \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -i ~/.ssh/deploy_key \
            -P "${VPS_PORT:-22}" \
            release.tgz \
            "${VPS_USER}@${VPS_HOST}:/tmp/scrumpoker-${RELEASE_ID}.tgz"

      - name: Activate release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -i ~/.ssh/deploy_key \
            -p "${VPS_PORT:-22}" \
            "${VPS_USER}@${VPS_HOST}" \
            bash -s -- \
            "$RELEASE_ID" \
            "/tmp/scrumpoker-${RELEASE_ID}.tgz" <<'REMOTE'
          set -Eeuo pipefail

          RELEASE_ID="$1"
          ARCHIVE="$2"
          APP_ROOT="/var/www/scrumpoker"
          RELEASE_DIR="$APP_ROOT/releases/$RELEASE_ID"
          PREVIOUS_STATIC="$(readlink "$APP_ROOT/current" 2>/dev/null || true)"
          PREVIOUS_BACKEND="$(readlink "$APP_ROOT/backend-current" 2>/dev/null || true)"

          # A migration to centralized rooms needs the reverse proxy and systemd
          # to be prepared BEFORE activating the new frontend.
          test -f "$APP_ROOT/.socketio-ready" || {
            echo "Missing $APP_ROOT/.socketio-ready; see the VPS preparation section in the PR description."
            exit 1
          }
          systemctl cat scrumpoker.service >/dev/null || {
            echo "Missing scrumpoker.service; see the VPS preparation section in the PR description."
            exit 1
          }
          command -v node >/dev/null
          command -v pnpm >/dev/null

          mkdir -p "$RELEASE_DIR"
          tar -xzf "$ARCHIVE" -C "$RELEASE_DIR"
          test -f "$RELEASE_DIR/public/index.html"
          test -f "$RELEASE_DIR/backend/server/index.ts"

          # Install only runtime dependencies in the backend directory,
          # which is not publicly reachable through Nginx.
          cd "$RELEASE_DIR/backend"
          pnpm install --prod --frozen-lockfile
          test -x node_modules/.bin/tsx

          rm -f "$APP_ROOT/current.next" "$APP_ROOT/backend-current.next"
          ln -s "$RELEASE_DIR/public" "$APP_ROOT/current.next"
          ln -s "$RELEASE_DIR/backend" "$APP_ROOT/backend-current.next"
          mv -Tf "$APP_ROOT/backend-current.next" "$APP_ROOT/backend-current"
          mv -Tf "$APP_ROOT/current.next" "$APP_ROOT/current"

          rollback() {
            echo "Restart or health check failed; restoring previous release."
            if [ -n "$PREVIOUS_STATIC" ]; then
              ln -sfn "$PREVIOUS_STATIC" "$APP_ROOT/current.rollback"
              mv -Tf "$APP_ROOT/current.rollback" "$APP_ROOT/current"
            else
              rm -f "$APP_ROOT/current"
            fi
            if [ -n "$PREVIOUS_BACKEND" ]; then
              ln -sfn "$PREVIOUS_BACKEND" "$APP_ROOT/backend-current.rollback"
              mv -Tf "$APP_ROOT/backend-current.rollback" "$APP_ROOT/backend-current"
              sudo -n systemctl restart scrumpoker.service || true
            else
              rm -f "$APP_ROOT/backend-current"
              sudo -n systemctl stop scrumpoker.service || true
            fi
            exit 1
          }

          sudo -n systemctl restart scrumpoker.service || rollback

          HEALTHY=false
          for i in {1..15}; do
            if curl --fail --silent http://127.0.0.1:3001/api/health >/dev/null; then
              HEALTHY=true
              break
            fi
            sleep 1
          done
          if [ "$HEALTHY" != true ]; then
            rollback
          fi

          rm -f "$ARCHIVE"

          find "$APP_ROOT/releases" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -printf '%T@ %p\n' |
            sort -nr |
            tail -n +6 |
            cut -d' ' -f2- |
            while IFS= read -r old_release; do
              rm -rf -- "$old_release"
            done
          REMOTE
